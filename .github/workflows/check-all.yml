name: Check all

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  zephyr-checks:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run portable Zephyr source checks
        shell: powershell
        run: python .\tools\CheckZephyr.py --project all --json

      - name: Run Zephyr checker regressions
        shell: powershell
        run: python -m unittest .\tools\tests\TestCheckZephyr.py
