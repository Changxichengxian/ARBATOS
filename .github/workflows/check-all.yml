name: Check all

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  zephyr-checks:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run portable Zephyr source checks
        shell: powershell
        run: python .\tools\build\CheckZephyr.py --project all --json

      - name: Check generated robot configurations
        shell: powershell
        run: python .\tools\config\RobotConfigGen.py check --target all

      - name: Run configuration and tool regressions
        shell: powershell
        run: python -m unittest discover -s .\tools\tests -p 'Test*.py'

  portable-controller-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run the portable controllers
        run: |
          python tools/config/RobotConfigGen.py generate --target HERO-M --out "$RUNNER_TEMP/robotconfig"
          cc -std=c11 -Wall -Wextra -Werror \
            -I"$RUNNER_TEMP/robotconfig" -Ishared/application/robot \
            -Ishared/controllers/differential_chassis -Ishared/controllers/speed_gimbal \
            tools/tests/ControllerAlgorithmsRegression.c \
            shared/controllers/differential_chassis/DifferentialChassis.c \
            shared/controllers/speed_gimbal/SpeedGimbal.c \
            -lm -o "$RUNNER_TEMP/controller-tests"
          "$RUNNER_TEMP/controller-tests"
          cc -std=c11 -Wall -Wextra -Werror \
            -Ishared/application/robot -Ishared/application/services/servo \
            tools/tests/ServoOutputRegression.c -o "$RUNNER_TEMP/servo-tests"
          "$RUNNER_TEMP/servo-tests"
          cc -std=c99 -Wall -Wextra -Werror \
            -Ishared/components/support -Ishared/application/motors \
            tools/tests/MotorTransmissionRegression.c -o "$RUNNER_TEMP/transmission-tests"
          "$RUNNER_TEMP/transmission-tests"
          cc -std=c99 -Wall -Wextra -Werror -Ishared/zephyr/port/sensors \
            tools/tests/Hi14ParserRegression.c shared/zephyr/port/sensors/Hi14Parser.c \
            -lm -o "$RUNNER_TEMP/hi14-tests"
          "$RUNNER_TEMP/hi14-tests"

  client-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r client/backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: client
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Check and build the client
        working-directory: client
        run: npm run build
      - name: Test workspace and device boundaries
        working-directory: client
        run: npm run test:backend
