CONFIG_CAN=y
CONFIG_STATS=y
CONFIG_CAN_STATS=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_MINIMAL_LIBC=y
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y
# 独立台架固件保持处理器唤醒，避免无复位线时无法重新连接 SWD。
CONFIG_CAN_BENCH_AWAKE=y
CONFIG_ASSERT=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
# SWD 直接读写测试状态，避免数据缓存遮住计数和命令。
CONFIG_DCACHE=n
