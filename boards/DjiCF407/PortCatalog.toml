schema = 1
board = "dji_c_f407"

[[roles]]
id = "rc_sbus"
label = "大疆 DBUS 接收机"
service = "RC_SBUS"
required_when_service = true
default_baud = 100000
baud_editable = false
protocols = ["sbus"]
required_capabilities = ["rx", "sbus"]
note = "使用现有 DBUS 解析和串口格式配置。默认板载接收口 USART3。"

[[roles]]
id = "elrs_crsf"
label = "ELRS / CRSF 接收机"
service = "ELRS_LINK"
required_when_service = true
default_baud = 420000
baud_editable = false
protocols = ["crsf"]
required_capabilities = ["rx", "crsf"]
note = "默认使用 USART1 的 PB7 RX，接 3.3 V TTL；不复用专用 DBUS 接收口。只接收通道和链路状态，不发送遥测。"

[[roles]]
id = "tuning_aux"
label = "调参 AUX"
service = "HOST_LINK"
default_baud = 230400
baud_editable = false
protocols = ["arbatos_aux"]
required_capabilities = ["rx", "tx", "aux"]
note = "复用 USART1 或 USART6 的 AuxPort/AuxTune 参数与遥测协议，需要启用 HOST_LINK。"

[[roles]]
id = "image_remote"
label = "图传遥控"
service = "HOST_LINK"
default_baud = 921600
baud_editable = false
protocols = ["image_remote"]
required_capabilities = ["rx", "tx", "aux"]
note = "使用 USART1 或 USART6 的图传遥控链路，需要启用 HOST_LINK。"

[[roles]]
id = "referee"
label = "裁判系统"
service = "REFEREE_RX"
required_when_service = true
default_baud = 115200
baud_editable = false
protocols = ["rm_referee"]
required_capabilities = ["rx", "tx", "referee"]

[[ports]]
id = "usart3"
node = "usart3"
label = "USART3 / PC11 RX, PC10 TX"
pins = ["PC10", "PC11"]
capabilities = ["rx", "tx", "sbus"]
note = "C 板设备树中的专用遥控接口。"

[[ports]]
id = "usart1"
node = "usart1"
label = "USART1 / PB7 RX, PA9 TX"
pins = ["PB7", "PA9"]
capabilities = ["rx", "tx", "crsf", "referee", "aux"]
reservations = ["console"]

[[ports]]
id = "usart6"
node = "usart6"
label = "USART6 / PG9 RX, PG14 TX"
pins = ["PG9", "PG14"]
capabilities = ["rx", "tx", "crsf", "referee", "aux"]

[[resources]]
id = "console"
label = "板级串口控制台"
pins = ["PB7", "PA9"]
severity = "warning"
note = "普通固件关闭串口日志；若另行启用控制台，不能同时分配给接收机或裁判。"
