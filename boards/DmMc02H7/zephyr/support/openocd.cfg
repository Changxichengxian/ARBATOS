# MC02 H723 with a CMSIS-DAP probe; the current wireless link used 500 kHz.
source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 500
reset_config none
# No init, reset, erase, flash or resume here. West/CLion chooses the action.
