# 车型能力唯一入口；参数、接线和输入映射仍在同目录 Config*.inc。
schema = 1
board = "dm_mc02_h7"
profile = "hero"
services = ["RC_SBUS", "ELRS_LINK", "HEALTH_MONITOR", "SDLOG", "BATTERY_MONITOR"]

[ports]
rc_sbus = "uart5"
elrs_crsf = { port = "uart7", baud = 420000, protocol = "crsf" }
rs485_0 = "usart2"
rs485_1 = "usart3"

[controllers.chassis]
type = "classic"

[controllers.gimbal]
type = "single"

[controllers.shoot]
type = "rm"

[features]
subboard_music = true
imu_mount = true
external_5v = true
watch_full = false

# 实机 SD 启动在 2 KiB 栈下触发保护异常；为文件系统调用保留余量。
[tasks.SDLOG]
stack_words = 2048

[build]
sources = ["RobotConfig.c", "Mc02Compat.c", "DetectTask.c", "ArmMotorTable.c", "PitchCaliBuiltin.c"]
shared_sources = ["shared/application/comm/host/HostLinkTaskStub.c"]
