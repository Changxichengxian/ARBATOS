# 车型能力唯一入口；参数、接线和输入映射仍在同目录 Config*.inc。
schema = 1
board = "dji_a_f427"
profile = "infantry"
services = ["RC_SBUS", "HEALTH_MONITOR", "SDLOG"]

[controllers.chassis]
type = "classic"

[controllers.gimbal]
type = "single"

[controllers.shoot]
type = "rm"

[features]
subboard_music = false
imu_mount = true
watch_full = false

# SD 初始化和文件系统调用需要比普通控制任务更大的栈。
[tasks.SDLOG]
stack_words = 2048

[build]
sources = ["RobotConfig.c", "DetectTask.c", "ArmMotorTable.c", "InfantryDiag.c"]
shared_sources = ["shared/application/comm/host/HostLinkTaskStub.c"]

[ports]
rc_sbus = "usart1"
