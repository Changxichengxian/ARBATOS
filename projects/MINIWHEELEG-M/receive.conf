# 首轮只核对 D-Bus、IMU 和 SD；CAN 应用发送被驱动拒绝，不创建控制任务。
CONFIG_ARBATOS_PREFLIGHT_ONLY=y
CONFIG_ARBATOS_RECEIVE_ONLY=y
CONFIG_ARBATOS_PREFLIGHT_AWAKE=y
CONFIG_ARBATOS_BENCH_TELEMETRY=y
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
# 静态检查邮箱由 SWD 读取，不让数据缓存遮住诊断状态。
CONFIG_DCACHE=n
